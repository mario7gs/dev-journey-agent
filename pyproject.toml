[project]
name = "dev-journey-agent"
version = "0.1.0"
description = "Dev-Journey-Agent: ticket-to-spec pipeline (Steps 0-4 + Critic)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "PyGithub>=2.0",
  "Jinja2>=3.1",
  "litellm>=1.0",
]

[project.scripts]
dev-journey = "main:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "src/agents", "src/core", "src/schemas", "src/tools"]

[tool.hatch.build.targets.wheel.force-include]
"src/main.py" = "main.py"
"src/templates" = "templates"
